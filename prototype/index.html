<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  /* 레이아웃: 전체화면 3D 경내 위에 먹빛 반투명 패널이 위(장소·설정)·아래(행동·이동)로 얹힌다.
     단일 테마(먹·단청) — 3D 장면의 시간대가 바뀌어도 패널은 항상 어두운 먹빛 위 한지색 글씨. */
  :root {
    --ink: rgba(17, 19, 25, 0.74);
    --ink-solid: #121419;
    --ink-soft: rgba(17, 19, 25, 0.5);
    --paper: #f1eadc;
    --paper-dim: rgba(241, 234, 220, 0.68);
    --line: rgba(241, 234, 220, 0.16);
    --dan-red: #b8432f;
    --dan-green: #2f7a68;
    --gold: #d7b25b;
    --gold-glow: rgba(215, 178, 91, 0.35);
    --lantern: #f0a04b;
    --ignite: 900ms cubic-bezier(.2, 0, 0, 1);
    --f-display: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--ink-solid); color: var(--paper);
    font-family: var(--f-body); font-size: 15px; line-height: 1.55;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
    border-radius: 999px; padding: 8px 14px; min-height: 40px;
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: 0.42; }

  /* 장면 위 패널 공통 (디자인 시스템 「화면 위 패널」): 먹 반투명 + blur 12, line 1px, radius-md, 한지 글자, 패딩 12/16 */
  .pnl {
    background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .en { font-size: 12px; color: var(--paper-dim); }

  /* 위: 왼쪽 워드마크·장소·함께 있기, 오른쪽 둥근 버튼(보기 · 소리) */
  .top {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5; display: flex; justify-content: space-between;
    align-items: flex-start; gap: 8px; pointer-events: none;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .top > * { pointer-events: auto; }
  /* 왼쪽 위: 로고만 (누르면 나가기). 다른 사람이 있으면 등불색 숫자 배지 */
  .logo { position: relative; width: 56px; height: 56px; min-height: 56px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
  .logo .mark { width: 48px; height: 48px; }
  .logo .badge {
    position: absolute; right: -4px; bottom: -4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    background: var(--lantern); color: var(--ink-solid); font-size: 12px; font-weight: 700; line-height: 22px; text-align: center;
    box-shadow: 0 0 10px rgba(240, 160, 75, 0.6); animation: glow 4s ease-in-out infinite;
  }
  @keyframes glow { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
  .tools { display: flex; gap: 8px; flex: none; }
  .round { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: var(--paper); }
  .round svg { width: 22px; height: 22px; }
  .round[aria-pressed="false"] { color: var(--paper-dim); }
  .round[aria-expanded="true"] { border-color: var(--gold); }

  /* 오른쪽 위 펼침 패널 (소리 · 보기) */
  .drop {
    position: fixed; z-index: 7; width: min(300px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 14px;
    top: calc(64px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    max-height: calc(100vh - 80px - env(safe-area-inset-top, 0px)); max-height: calc(100dvh - 80px - env(safe-area-inset-top, 0px));
    overflow-y: auto; overscroll-behavior: contain;   /* 가로 화면에서도 아래(백그라운드 재생·출처)까지 */
  }
  .drop-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .drop-head b { font-family: var(--f-display); font-size: 16px; }
  .drop-head b .en { margin-left: 6px; font-family: var(--f-body); font-weight: 400; }
  .srow { display: grid; grid-template-columns: 24px 1fr; column-gap: 10px; row-gap: 4px; align-items: center; }
  .srow > svg { grid-column: 1; grid-row: 1; width: 22px; height: 22px; color: var(--paper-dim); }
  .srow .nm { grid-column: 2; grid-row: 1; font-size: 14px; }
  .srow .nm .en, .vrow .nm .en { margin-left: 6px; }
  .srow .sl { grid-column: 2; grid-row: 2; }
  .srow .chips { grid-column: 2; grid-row: 3; }
  .bgrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .bgrow .nm { font-size: 14px; } .bgrow .nm > .en { margin-left: 6px; }
  .bgrow small { display: block; margin-top: 2px; font-size: 11px; line-height: 1.45; color: var(--paper-dim); word-break: keep-all; }
  .bgrow small .en { font-size: 11px; }
  .vrow { display: flex; flex-direction: column; gap: 6px; }
  .vrow .nm { font-size: 14px; }
  /* 슬라이더: 트랙 line, 채움 gold, 손잡이 paper 16px */
  input[type=range].sl { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; margin: 0; background: transparent; --v: 50%; }
  .sl::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--gold) var(--v), var(--line) var(--v)); }
  .sl::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border: 0; border-radius: 50%; background: var(--paper); }
  .sl::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
  .sl::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--gold); }
  .sl::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--paper); }
  .switch { width: 46px; height: 26px; min-height: 26px; padding: 0; border-radius: 999px; background: var(--line); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper-dim); transition: transform 300ms, background-color 300ms; }
  .switch[aria-checked="true"] { background: var(--gold); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--ink-solid); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); font-size: 13px; padding: 4px 10px; min-height: 32px; }
  .chip[aria-pressed="true"] { background: var(--paper); color: var(--ink-solid); border-color: var(--paper); }
  .drop .src { margin: 0; font-size: 8px; color: var(--paper-dim); line-height: 1.35; opacity: 0.75; } /* 출처: 아주 작게 */
  /* 로고 메뉴: 왼쪽 위, 로고 바로 아래 */
  .drop.menu { left: max(16px, env(safe-area-inset-left, 0px)); right: auto; top: calc(76px + env(safe-area-inset-top, 0px)); width: min(280px, calc(100% - 32px)); gap: 12px; }
  .menu-head { display: flex; align-items: baseline; gap: 8px; }
  .menu-head b { font-family: var(--f-display); font-size: 18px; }
  .menu-head .en { letter-spacing: 0.18em; font-size: 10px; }
  .mrow { display: flex; flex-direction: column; gap: 2px; }
  .mrow .nm { font-size: 12px; color: var(--paper-dim); }
  .mrow .nm .en { margin-left: 6px; font-size: 11px; }
  .mrow .val { font-size: 15px; }
  .mrow .together { display: flex; align-items: center; gap: 8px; }
  .mrow .together i { width: 8px; height: 8px; border-radius: 50%; background: var(--lantern); flex: none; animation: glow 4s ease-in-out infinite; }
  .mrow .hint { font-size: 12px; color: var(--paper-dim); }
  .mrow .hint:empty { display: none; }
  .lanterns { display: flex; flex-wrap: wrap; gap: 6px; }
  .lanterns:empty { display: none; }
  .lanterns i { width: 12px; height: 16px; border-radius: 6px 6px 4px 4px; background: var(--lantern); box-shadow: 0 0 8px rgba(240, 160, 75, 0.6); }
  .lanterns i.me { background: var(--paper); box-shadow: none; }
  .leave-btn { border: 1px solid var(--line); border-radius: 999px; min-height: 44px; font-size: 15px; margin-top: 2px; }
  .leave-btn .en { margin-left: 6px; }
  .logo[aria-expanded="true"] { border-color: var(--gold); }

  /* 아래: 행동 바(가운데) · 진행 카운트(오른쪽) · 장소 고르기 */
  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .bar { display: flex; padding: 6px; }
  .bar:empty { display: none; }
  .act {
    width: 72px; min-height: 60px; padding: 6px 4px; border-radius: 10px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 1.2;
  }
  .act svg { width: 24px; height: 24px; position: relative; }
  .act span { position: relative; text-align: center; }
  .act.main svg, .act.on svg, .act.on span { color: var(--gold); }
  .act .fill { position: absolute; inset: 0; background: var(--gold); transform-origin: 0 50%; transform: scaleX(0); opacity: 0.3; }
  .count { align-self: flex-end; width: 168px; display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; }
  .count .n { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .count .track { height: 8px; border-radius: 4px; background: var(--line); position: relative; }
  .count .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; background: var(--gold); transition: width 600ms cubic-bezier(.2, 0, 0, 1); }
  .count.done .track::after { content: ""; position: absolute; right: -2px; top: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
  .count small { font-size: 12px; color: var(--paper-dim); }
  .places-pop { width: min(320px, 100%); display: flex; flex-direction: column; gap: 4px; padding: 8px; }
  .places-pop button { text-align: left; border-radius: 8px; padding: 8px 12px; min-height: 40px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .places-pop button.here { background: var(--paper); color: var(--ink-solid); }
  .places-pop button.here .en { color: rgba(18, 20, 25, 0.6); }
  .places-pop .guide { background: var(--gold); color: var(--ink-solid); font-weight: 700; justify-content: center; border-radius: 999px; margin-bottom: 4px; }
  .places-pop .soon { font-size: 11px; color: var(--gold); }

  /* 현판 식 제목: 장소에 들어설 때 2초 */
  #signboard {
    position: fixed; left: 50%; top: 24%; transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
    border-radius: 999px; padding: 10px 28px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    opacity: 0; transition: opacity 600ms cubic-bezier(.2, 0, 0, 1);
  }
  #signboard.show { opacity: 1; }
  #signboard b { font-family: var(--f-display); font-size: 32px; line-height: 1.2; color: var(--gold); letter-spacing: 0.08em; white-space: nowrap; }
  #signboard small { font-size: 11px; letter-spacing: 0.18em; color: var(--paper-dim); white-space: nowrap; }

  /* 조이스틱 (걸을 때만, 왼쪽 아래) */
  .joy {
    align-self: flex-start; width: 104px; height: 104px; border-radius: 50%; position: relative; flex: none;
    background: rgba(18, 20, 26, 0.32); border: 1px solid var(--line); touch-action: none;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .joy[hidden] { display: none; }
  .joy i {
    position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: var(--paper); opacity: 0.85; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); pointer-events: none;
  }
  .joy.on i { opacity: 1; }
  .joy.free { position: fixed; z-index: 6; margin: 0; }
  .joy-grip {
    position: absolute; top: -8px; right: -8px; width: 32px; height: 32px; border-radius: 50%; padding: 0; min-height: 0;
    background: var(--ink); border: 1px solid var(--line); color: var(--paper); display: grid; place-items: center;
    touch-action: none; cursor: grab;
  }
  .joy-grip svg { width: 18px; height: 18px; }
  .joy.moving { outline: 2px dashed var(--gold); outline-offset: 4px; }
  /* 입장 화면 */
  #gate {
    position: fixed; inset: 0; z-index: 20; display: flex; overflow-y: auto; padding-block: 20px;
    background: radial-gradient(ellipse at 50% 40%, rgba(18, 20, 26, 0.55), rgba(18, 20, 26, 0.92) 70%);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    transition: opacity 1.2s ease;
  }
  #gate.leaving { opacity: 0; pointer-events: none; }
  .gate-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; max-width: 420px; margin: auto; }
  .hyeonpan {
    /* 현판: 검은 판 위 금빛 글씨, 단청 테두리 */
    background: #1c1a17; border: 2px solid var(--gold);
    box-shadow: 0 0 0 3px var(--dan-green), 0 0 0 5px var(--dan-red), 0 18px 40px rgba(0, 0, 0, 0.5);
    padding: 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: var(--f-display); font-size: 36px; font-weight: 700; color: var(--gold); line-height: 1;
  }
  .gate-cap { font-size: 13px; color: var(--paper); letter-spacing: 0.08em; margin: -4px 0 0; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9); }
  .gate-name { font-family: var(--f-display); font-size: 40px; font-weight: 700; letter-spacing: 0.06em; margin: 8px 0 0; line-height: 1.1; }
  .gate-tag { font-family: var(--f-display); font-size: 16px; color: var(--gold); margin: -10px 0 0; text-wrap: balance; }
  .gate-sub { color: var(--paper-dim); font-size: 15px; margin: 0; text-wrap: balance; }
  /* 전원 버튼: 한지 원판 위 먹 마크. 누르면 원판이 먹으로, 마크가 금으로 바뀌며 불이 켜짐 (마음 ON) */
  .power {
    position: relative; width: 176px; height: 176px; padding: 0; border-radius: 50%;
    background: var(--paper); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    transition: transform var(--ignite), background-color var(--ignite), box-shadow var(--ignite);
  }
  .power img { position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; transition: opacity var(--ignite); }
  .power .m-gold { opacity: 0; }
  .power::after {
    content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1.5px solid var(--gold);
    opacity: 0.5; animation: breathe 4s ease-in-out infinite; pointer-events: none;
  }
  .power:hover { transform: scale(1.02); }
  .power.on { transform: scale(1.04); background: var(--ink-solid); box-shadow: 0 0 48px var(--gold-glow), 0 12px 40px rgba(0, 0, 0, 0.35); }
  .power.on .m-ink { opacity: 0; }
  .power.on .m-gold { opacity: 1; }
  .power.on::after { animation: none; opacity: 0; }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.2; } 50% { transform: scale(1.05); opacity: 0.65; } }
  .power-label { display: flex; flex-direction: column; align-items: center; gap: 2px; margin: -4px 0 0; font-family: var(--f-display); font-size: 18px; font-weight: 700; }
  /* 준비 중: 부처님·오리·그림을 받는 동안 (들어가는 건 언제든 됨) */
  .ready { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 160px; margin: -6px 0 0; transition: opacity 600ms; }
  .ready.done { opacity: 0.55; }
  .ready-bar { width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .ready-bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 300ms; }
  .ready small { font-size: 11px; color: var(--paper-dim); letter-spacing: 0.06em; }
  .power-label small { font-family: var(--f-body); font-size: 11px; font-weight: 400; letter-spacing: 0.18em; color: var(--paper-dim); }
  .enter.quiet { background: none; color: var(--paper-dim); border: 1px solid var(--line); font-size: 14px; padding: 8px 18px; min-height: 40px; }
  .gate-lang { display: flex; gap: 6px; }
  .proto { font-size: 11px; color: var(--paper-dim); letter-spacing: 0.06em; }
  .gate-note { margin: 0; font-size: 11px; color: var(--paper-dim); text-wrap: balance; }
  .gate-note a { color: var(--gold); }
  .legal { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .legal a { font-size: 11px; color: var(--paper-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  .drop .legal { justify-content: flex-start; }
  /* 오른쪽 옆: 보기·소리 아래로 장면 담기 · 공유를 세로로 */
  .side { position: fixed; z-index: 5; display: flex; flex-direction: column; gap: 8px;
    top: calc(64px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  /* 장면 담기: 찍은 장면을 크게 보여 주고 저장·공유 */
  .snap { position: fixed; inset: 0; z-index: 30; background: rgba(12, 13, 17, 0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px; }
  .snap img { max-width: 100%; max-height: 70vh; border-radius: 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); }
  .snap-acts { display: flex; gap: 8px; }
  .snap-save { background: var(--gold); color: var(--ink-solid); font-weight: 700; border-radius: 999px; padding: 6px 18px; text-decoration: none; display: inline-flex; align-items: center; min-height: 32px; }
  .snap-hint { margin: 0; font-size: 12px; color: var(--paper-dim); }

  /* 합장 */
  #hands {
    position: fixed; left: 0; right: 0; bottom: 0; height: 46%; z-index: 4; pointer-events: none;
    display: flex; justify-content: center; align-items: flex-end; gap: 0;
  }
  .palm {
    width: 74px; height: 190px; background: linear-gradient(180deg, #e9cdb2, #c99e7f);
    border-radius: 40px 40px 18px 18px; box-shadow: inset -6px 0 12px rgba(0, 0, 0, 0.12);
    transform-origin: 50% 100%; transition: transform 1.1s cubic-bezier(.3, .7, .2, 1);
  }
  .palm.l { transform: translate(-90px, 70px) rotate(-28deg); }
  .palm.r { transform: translate(90px, 70px) rotate(28deg); }
  #hands.join .palm.l { transform: translate(2px, 8px) rotate(-3deg); }
  #hands.join .palm.r { transform: translate(-2px, 8px) rotate(3deg); }
  .hold { position: relative; overflow: hidden; }
  .hold .fill { position: absolute; inset: 0; background: var(--gold); transform-origin: 0 50%; transform: scaleX(0); opacity: 0.45; }
  .hold span { position: relative; }

  /* 문구 */
  #toast {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 6;
    font-family: var(--f-display); font-size: 21px; text-align: center; text-wrap: balance;
    width: min(360px, calc(100% - 32px)); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
    opacity: 0; transition: opacity 0.9s ease; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  /* 소식: 같은 방 사람이 합장하면 위쪽 가운데에 잠깐 (먹 패널, 금 손 모양) */
  .news {
    position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; top: calc(74px + env(safe-area-inset-top, 0px)); transform: translateY(-6px); z-index: 6;
    max-width: calc(100% - 152px); display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    background: var(--ink); border: 1px solid var(--line); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-size: 14px; line-height: 1.35; color: var(--paper); pointer-events: none;
    opacity: 0; transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .news.show { opacity: 1; transform: translateY(0); }
  .news-ic { display: grid; place-items: center; color: var(--gold); flex: none; }
  .news-ic svg { width: 18px; height: 18px; }
  .news span { text-wrap: balance; word-break: keep-all; }  /* 한글 낱말이 '님/이'처럼 갈리지 않게 */

  /* 호흡 */
  #breath {
    position: fixed; left: 50%; top: 27%; transform: translate(-50%, -50%); z-index: 4;
    display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
  }
  .orb {
    width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(241, 234, 220, 0.75);
    background: radial-gradient(circle, rgba(215, 178, 91, 0.28), rgba(215, 178, 91, 0.04) 70%);
    transform: scale(0.55);
  }
  .breath-word { font-family: var(--f-display); font-size: 22px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
  .breath-time { font-size: 13px; color: var(--paper-dim); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    #gate, .palm, #toast, .news, .power, .power img { transition: none; }
    .power::after, .logo .badge, .mrow .together i { animation: none; }
    #signboard { transition: none; }
  }
  @media (max-width: 420px) {
    .hyeonpan { font-size: 32px; }
    .gate-name { font-size: 34px; }
  }
</style>

/* 출처: 마음온/brand/avatar/duck.js (디자인 세션, 컨셉 보드에 맞춘 판) — 그대로 붙여 넣음.
 * 지금은 Blender 오리(GLB)를 못 받았을 때만 쓰는 대체 오리 */
/* 마음온 도반 오리 (가칭 심덕) — three.js r128 아바타. 컨셉 보드 「심덕」 기준.
 * 사용: const duck = new MaumDuck(); scene.add(duck.root); duck.setPose('hapjang'); 매 프레임 duck.update(dt)
 * 단위: 씬 유닛. 발바닥 y=0, 머리 꼭대기 y≈1.56. 정면은 +z.
 * root = { rig(몸, 포즈에 따라 내려앉음), 좌복, 연잎 }. 이동·회전은 root 에.
 */
(function (global) {
  const T = global.THREE;

  const COLORS = {
    cream:   0xf9e9b9, // 몸·머리·손 (연노랑 크림)
    beak:    0xf0953f, // 부리·발 (주황)
    beakDark:0xd87a2a, // 부리 아래
    cheek:   0xf2b1a8, // 볼터치
    ink:     0x1a1714, // 눈
    robe:    0xd6d1c7, // 저고리·소매 (밝은 회색)
    lapel:   0xe8e4db, // 깃 (저고리보다 밝게)
    sash:    0x8a6240, // 가사 띠 (갈색)
    belt:    0x6b4a30, // 허리끈 (갈색)
    pack:    0x8a6240, // 걸망
    packDark:0x5a3f28, // 걸망 덮개·멜빵
    cushion: 0x4a4650, // 좌복 (회보라 방석)
    leaf:    0x6f9a5a  // 연잎
  };

  function mat(c, extra) { return new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7, metalness: 0 }, extra || {})); }
  function sphere(r, c, sx, sy, sz) { const m = new T.Mesh(new T.SphereGeometry(r, 40, 28), mat(c)); m.scale.set(sx || 1, sy || 1, sz || 1); return m; }
  // 회전체: [반지름, 세계 y] 목록 → torso 로컬(y-0.22)
  function lathe(profile, c, segs) { const pts = profile.map(p => new T.Vector2(p[0], p[1] - 0.22)); return new T.Mesh(new T.LatheGeometry(pts, segs || 48), mat(c)); }

  function MaumDuck() {
    this.root = new T.Group();
    this.t = 0; this.pose = 'stand'; this.blend = 1;
    this.cur = {}; this.from = {}; this.to = {};

    const rig = this.rig = new T.Group(); this.root.add(rig);
    const hips = this.hips = new T.Group(); rig.add(hips);

    // ── 다리·물갈퀴 발 (피벗: 고관절)
    this.legs = [-1, 1].map(side => {
      const p = new T.Group(); p.position.set(side * 0.13, 0.22, 0.02);
      const leg = new T.Mesh(new T.CylinderGeometry(0.04, 0.045, 0.20, 16), mat(COLORS.beak)); leg.position.y = -0.10; p.add(leg);
      const foot = sphere(1, COLORS.beak, 0.11, 0.035, 0.17); foot.position.set(0, -0.20, 0.06); p.add(foot);
      [-1, 0, 1].forEach(k => { const toe = sphere(1, COLORS.beak, 0.035, 0.03, 0.07); toe.position.set(k * 0.06, -0.20, 0.19); p.add(toe); });
      hips.add(p); return p;
    });

    // ── 몸통 (피벗 y 0.22). 저고리를 입은 몸 전체를 둥근 회전체 하나로
    const torso = this.torso = new T.Group(); torso.position.y = 0.22; hips.add(torso);
    const body = lathe([[0.40, 0.22], [0.45, 0.30], [0.46, 0.42], [0.43, 0.56], [0.36, 0.70], [0.26, 0.82], [0.14, 0.90], [0.0, 0.93]], COLORS.robe);
    torso.add(body);
    const hem = new T.Mesh(new T.TorusGeometry(0.40, 0.012, 8, 56), mat(COLORS.robe)); hem.rotation.x = Math.PI / 2; hem.position.y = 0.0; torso.add(hem);
    // V자 깃: 두 장의 얇은 띠가 가슴 앞에서 겹침
    [-1, 1].forEach(s => { const l = new T.Mesh(new T.BoxGeometry(0.07, 0.40, 0.025), mat(COLORS.lapel)); l.position.set(s * 0.10, 0.50, 0.40); l.rotation.set(-0.35, 0, s * 0.45); torso.add(l); });
    // 가사 띠: 왼쪽 어깨에서 오른쪽 허리로
    const sash = new T.Mesh(new T.TorusGeometry(0.40, 0.05, 12, 56), mat(COLORS.sash)); sash.rotation.set(Math.PI / 2 + 0.55, 0, 0.5); sash.position.y = 0.38; torso.add(sash);
    const belt = new T.Mesh(new T.TorusGeometry(0.455, 0.035, 10, 56), mat(COLORS.belt)); belt.rotation.x = Math.PI / 2; belt.position.y = 0.26; torso.add(belt);
    const knot = sphere(1, COLORS.belt, 0.06, 0.045, 0.04); knot.position.set(0.12, 0.26, 0.44); torso.add(knot);
    // 걸망
    const pack = new T.Mesh(new T.BoxGeometry(0.30, 0.30, 0.14), mat(COLORS.pack)); pack.position.set(0, 0.42, -0.40); torso.add(pack);
    const flap = new T.Mesh(new T.BoxGeometry(0.31, 0.10, 0.15), mat(COLORS.packDark)); flap.position.set(0, 0.54, -0.40); torso.add(flap);
    const buckle = sphere(1, COLORS.packDark, 0.03, 0.03, 0.02); buckle.position.set(0, 0.47, -0.48); torso.add(buckle);
    [-1, 1].forEach(s => { const strap = new T.Mesh(new T.BoxGeometry(0.045, 0.36, 0.02), mat(COLORS.packDark)); strap.position.set(s * 0.15, 0.56, -0.28); strap.rotation.x = -0.45; torso.add(strap); });

    // ── 소매 + 손 (피벗: 어깨)
    this.wings = [-1, 1].map(side => {
      const p = new T.Group(); p.position.set(side * 0.37, 0.52, 0.12); p.userData.side = side;
      const sleeve = sphere(1, COLORS.robe, 0.11, 0.18, 0.12); sleeve.position.y = -0.14; p.add(sleeve);
      const cuff = new T.Mesh(new T.TorusGeometry(0.095, 0.02, 8, 32), mat(COLORS.lapel)); cuff.rotation.x = Math.PI / 2; cuff.position.y = -0.29; p.add(cuff);
      const hand = sphere(1, COLORS.cream, 0.08, 0.065, 0.09); hand.position.y = -0.32; p.add(hand);
      torso.add(p); return p;
    });

    // ── 머리 (피벗: 목, torso 로컬 y 0.66 = 세계 0.88). 머리가 몸 위에 겹쳐 앉음
    const neck = this.neck = new T.Group(); neck.position.y = 0.66; torso.add(neck);
    const head = sphere(0.44, COLORS.cream, 1.0, 0.96, 1.0); head.position.y = 0.26; neck.add(head);
    // 머리 위 잔털 세 가닥
    [[0, 0.68, 0.0, 0.15, 0.0], [-0.07, 0.67, 0.04, 0.35, 0.3], [0.06, 0.67, -0.03, -0.3, -0.25]].forEach(a => {
      const h = new T.Mesh(new T.ConeGeometry(0.022, 0.12, 8), mat(COLORS.cream)); h.position.set(a[0], a[1], a[2]); h.rotation.set(a[4], 0, a[3]); neck.add(h); });
    this.eyes = [-1, 1].map(s => {
      const e = sphere(0.065, COLORS.ink, 1, 1.25, 0.5); e.position.set(s * 0.17, 0.27, 0.405); neck.add(e);
      const hi = sphere(0.02, 0xffffff); hi.position.set(0.02, 0.03, 0.05); e.add(hi);
      const hi2 = sphere(0.01, 0xffffff); hi2.position.set(-0.025, -0.025, 0.05); e.add(hi2);
      const cheek = sphere(1, COLORS.cheek, 0.08, 0.055, 0.03); cheek.position.set(s * 0.31, 0.14, 0.30); neck.add(cheek);
      return e;
    });
    const beakU = sphere(1, COLORS.beak, 0.14, 0.075, 0.11); beakU.position.set(0, 0.15, 0.44); neck.add(beakU);
    const beakL = sphere(1, COLORS.beakDark, 0.11, 0.05, 0.09); beakL.position.set(0, 0.10, 0.43); neck.add(beakL);

    // ── 소품
    const cushion = new T.Mesh(new T.CylinderGeometry(0.58, 0.62, 0.10, 40), mat(COLORS.cushion)); cushion.position.y = 0.05; cushion.visible = false; this.root.add(cushion);
    const leaf = new T.Mesh(new T.CylinderGeometry(0.95, 0.92, 0.04, 48), mat(COLORS.leaf)); leaf.position.y = 0.02; leaf.visible = false; this.root.add(leaf);
    const vein = new T.Mesh(new T.TorusGeometry(0.6, 0.008, 6, 48), mat(0x5a8247)); vein.rotation.x = Math.PI / 2; vein.position.y = 0.045; leaf.add(vein);
    this.props = { cushion, leaf };

    this.root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    this.setPose('stand', true);
  }

  // 포즈 사전: 각도는 라디안. wing/leg 배열은 [앞으로, 안쪽/바깥쪽으로]
  const POSES = {
    stand:   { rootY: 0,     torsoX: 0,    headX: 0,    wing: [0.15, 0.1],  leg: [0, 0],        eye: 1,    prop: null },
    walk:    { rootY: 0,     torsoX: 0.05, headX: 0.05, wing: [0.15, 0.15], leg: [0, 0],        eye: 1,    prop: null },
    sit:     { rootY: -0.14, torsoX: 0.04, headX: 0.08, wing: [-0.6, 0.4],  leg: [-1.55, 0.9],  eye: 1,    prop: 'cushion' },
    breathe: { rootY: -0.18, torsoX: 0.02, headX: 0.12, wing: [-0.6, 0.4],  leg: [-1.55, 0.9],  eye: 0.12, prop: 'leaf' },
    hands:   { rootY: 0,     torsoX: 0.03, headX: 0.14, wing: [-1.25, 1.0], leg: [0, 0],        eye: 0.6,  prop: null }, // 합장: 손 모음
    halfbow: { rootY: 0,     torsoX: 0.5,  headX: 0.49, wing: [-1.25, 1.0], leg: [0, 0],        eye: 0.3,  prop: null }, // 합장: 반배로 숙임
    kneel:   { rootY: -0.14, torsoX: 0.15, headX: 0.1,  wing: [-0.4, 0.2],  leg: [-1.45, 0.15], eye: 1,    prop: 'cushion' },
    prostrate:{ rootY: -0.16, torsoX: 1.25, headX: 0.45, wing: [-1.7, 0.25], leg: [-1.45, 0.15], eye: 0.12, prop: 'cushion' }
  };
  // 시퀀스 동작: [포즈, 초]. loop=false 면 한 번 재생 후 마지막 포즈에 머문다 (duck.done 이 true, onDone 호출)
  const SEQUENCES = {
    bow:     { loop: true,  steps: [['stand', 0.48], ['kneel', 0.72], ['prostrate', 1.2], ['kneel', 0.64], ['stand', 0.96]] }, // 큰절 한 번 = 4초
    hapjang: { loop: false, steps: [['hands', 0.8], ['halfbow', 1.3], ['halfbow', 0.7], ['hands', 1.2]] }                    // 반배: 모으기→숙이기→머물기→일어나기
  };
  MaumDuck.POSES = POSES; MaumDuck.SEQUENCES = SEQUENCES; MaumDuck.COLORS = COLORS;

  const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  function mix(a, b, k) {
    return { rootY: lerp(a.rootY, b.rootY, k), torsoX: lerp(a.torsoX, b.torsoX, k), headX: lerp(a.headX, b.headX, k),
      wing: [lerp(a.wing[0], b.wing[0], k), lerp(a.wing[1], b.wing[1], k)], leg: [lerp(a.leg[0], b.leg[0], k), lerp(a.leg[1], b.leg[1], k)],
      eye: lerp(a.eye, b.eye, k), prop: k < 0.5 ? a.prop : b.prop };
  }

  MaumDuck.prototype.setPose = function (name, instant, onDone) {
    this.pose = name; this.t = 0; this.done = false; this.onDone = onDone || null;
    const seq = SEQUENCES[name];
    const target = seq ? POSES[seq.steps[0][0]] : POSES[name];
    this.from = this.cur.rootY === undefined ? target : Object.assign({}, this.cur);
    this.to = target; this.blend = instant ? 1 : 0;
  };

  MaumDuck.prototype.apply = function (p, t) {
    const breathing = this.pose === 'breathe';
    const period = breathing ? 8 : 4;
    const br = Math.sin(t * Math.PI * 2 / period);
    const amp = breathing ? 0.035 : 0.012;
    this.rig.position.y = p.rootY + (this.pose === 'walk' ? Math.abs(Math.sin(t * Math.PI * 2 * 1.6)) * 0.025 : 0);
    this.torso.rotation.x = p.torsoX;
    this.torso.scale.set(1 - br * amp * 0.5, 1 + br * amp, 1 - br * amp * 0.5);
    this.neck.rotation.x = p.headX + br * 0.01;
    this.neck.rotation.y = this.pose === 'walk' ? Math.sin(t * Math.PI * 2 * 0.8) * 0.08 : 0;
    const swing = this.pose === 'walk' ? Math.sin(t * Math.PI * 2 * 1.6) : 0;
    this.wings.forEach(w => { const s = w.userData.side;
      w.rotation.x = p.wing[0] + swing * -s * 0.35;
      w.rotation.z = -s * p.wing[1];
    });
    this.legs.forEach((l, i) => { const s = i === 0 ? -1 : 1;
      l.rotation.x = p.leg[0] + swing * s * 0.55;
      l.rotation.z = s * p.leg[1];
    });
    this.eyes.forEach(e => { e.scale.y = 1.25 * p.eye; });
    this.props.cushion.visible = p.prop === 'cushion';
    this.props.leaf.visible = p.prop === 'leaf';
  };

  MaumDuck.prototype.update = function (dt) {
    this.t += dt;
    let p;
    const seq = SEQUENCES[this.pose];
    if (seq) {
      const steps = seq.steps, total = steps.reduce((a, s) => a + s[1], 0);
      let u = seq.loop ? this.t % total : Math.min(this.t, total);
      let acc = 0, p0 = this.from, p1 = POSES[steps[0][0]], k = 1;
      for (let i = 0; i < steps.length; i++) { const [n, len] = steps[i];
        if (u < acc + len || i === steps.length - 1) {
          p0 = i === 0 ? (seq.loop ? POSES[steps[steps.length - 1][0]] : this.from) : POSES[steps[i - 1][0]];
          p1 = POSES[n]; k = Math.min(1, (u - acc) / len); break; }
        acc += len; }
      p = mix(p0, p1, ease(Math.min(1, k * 1.25)));
      if (!seq.loop && !this.done && this.t >= total) { this.done = true; if (this.onDone) this.onDone(); }
    } else {
      this.blend = Math.min(1, this.blend + dt / 0.6);
      p = mix(this.from, this.to, ease(this.blend));
    }
    this.cur = p; this.apply(p, this.t);
  };

  global.MaumDuck = MaumDuck;
})(window);
</script>
<script>
/* 출처: 마음온/brand/avatar/blender/duck-glb.js (디자인 세션, Blender 모델) — 포즈·시퀀스는 그대로,
 * 시제품용으로 바꾼 곳: ① GLB를 한 번만 받아 오리마다 복제(다른 방문자 오리) ② 못 받으면 onError */
(function (global) {
  const T = global.THREE;
  const POSES = {
    stand:   { rootY: 0,     torsoX: 0,    headX: 0,    wing: [-0.15, 0.1], leg: [0, 0],        eye: 1 },
    walk:    { rootY: 0,     torsoX: 0.05, headX: 0.05, wing: [-0.15, 0.15], leg: [0, 0],       eye: 1 },
    sit:     { rootY: -0.14, torsoX: 0.04, headX: 0.08, wing: [-0.6, 0.4],  leg: [-1.55, 0.9],  eye: 1 },
    breathe: { rootY: -0.18, torsoX: 0.02, headX: 0.12, wing: [-0.6, 0.4],  leg: [-1.55, 0.9],  eye: 0.12 },
    hands:   { rootY: 0,     torsoX: 0.03, headX: 0.14, wing: [-1.25, 1.0], leg: [0, 0],        eye: 0.6 },
    halfbow: { rootY: 0,     torsoX: 0.5,  headX: 0.49, wing: [-1.25, 1.0], leg: [0, 0],        eye: 0.3 },
    kneel:   { rootY: -0.14, torsoX: 0.15, headX: 0.1,  wing: [-0.4, 0.2],  leg: [-1.45, 0.15], eye: 1 },
    prostrate:{ rootY: -0.16, torsoX: 1.25, headX: 0.45, wing: [-1.7, 0.25], leg: [-1.45, 0.15], eye: 0.12 }
  };
  const SEQUENCES = {
    bow:     { loop: true,  steps: [['stand', 0.48], ['kneel', 0.72], ['prostrate', 1.2], ['kneel', 0.64], ['stand', 0.96]] },
    hapjang: { loop: false, steps: [['hands', 0.8], ['halfbow', 1.3], ['halfbow', 0.7], ['hands', 1.2]] }
  };
  const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  const mix = (a, b, k) => ({ rootY: lerp(a.rootY, b.rootY, k), torsoX: lerp(a.torsoX, b.torsoX, k), headX: lerp(a.headX, b.headX, k),
    wing: [lerp(a.wing[0], b.wing[0], k), lerp(a.wing[1], b.wing[1], k)], leg: [lerp(a.leg[0], b.leg[0], k), lerp(a.leg[1], b.leg[1], k)], eye: lerp(a.eye, b.eye, k) });

  const cache = {}; // url → Promise<gltf.scene> (한 번만 받음)
  // 모델은 meshopt로 압축(gltfpack) — 풀개 붙인 로더
  function newLoader() { const l = new T.GLTFLoader(); if (global.MeshoptDecoder) l.setMeshoptDecoder(global.MeshoptDecoder); return l; }
  // 압축된 법선(정수)은 그대로 다시 계산하면 깨짐 → 지우고 실수로 새로 계산
  function smoothNormals(g) { const n = g.attributes.normal; if (n && !(n.array instanceof Float32Array)) g.deleteAttribute('normal'); g.computeVertexNormals(); }
  global.maumGLTF = { newLoader, smoothNormals };
  function loadScene(url) {
    if (!cache[url]) cache[url] = new Promise((ok, fail) => {
      if (!T.GLTFLoader) return fail(new Error('no GLTFLoader'));
      newLoader().load(url, g => {
        g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; smoothNormals(o.geometry); } });
        ok(g.scene);
      }, undefined, fail);
    });
    return cache[url];
  }

  function MaumDuckGLB(url, onLoad, onError) {
    this.root = new T.Group(); this.root.rotation.y = Math.PI;
    this.t = 0; this.pose = 'stand'; this.blend = 1; this.cur = {}; this.from = POSES.stand; this.to = POSES.stand; this.ready = false;
    const self = this;
    loadScene(url).then(src => {
      const s = src.clone(true); self.root.add(s);
      const get = n => s.getObjectByName(n);
      self.hips = get('hips'); self.torso = get('torso'); self.neck = get('neck');
      self.wings = [get('wingL'), get('wingR')]; self.legs = [get('legL'), get('legR')]; self.eyes = [get('eyeL'), get('eyeR')];
      self.base = { hipsY: self.hips.position.y, eyeY: self.eyes[0].scale.y };
      self.ready = true; self.setPose(self.pose, true); if (onLoad) onLoad(self);
    }, e => { if (onError) onError(e); });
  }
  MaumDuckGLB.POSES = POSES; MaumDuckGLB.SEQUENCES = SEQUENCES;

  MaumDuckGLB.prototype.setPose = function (name, instant, onDone) {
    this.pose = name; this.t = 0; this.done = false; this.onDone = onDone || null;
    const seq = SEQUENCES[name]; const target = seq ? POSES[seq.steps[0][0]] : POSES[name];
    this.from = this.cur.rootY === undefined ? target : Object.assign({}, this.cur);
    this.to = target; this.blend = instant ? 1 : 0;
  };

  MaumDuckGLB.prototype.apply = function (p, t) {
    if (!this.ready) return;
    const breathing = this.pose === 'breathe', period = breathing ? 8 : 4, br = Math.sin(t * Math.PI * 2 / period), amp = breathing ? 0.035 : 0.012;
    const walking = this.pose === 'walk', swing = walking ? Math.sin(t * Math.PI * 2 * 1.6) : 0;
    this.hips.position.y = this.base.hipsY + p.rootY + (walking ? Math.abs(swing) * 0.025 : 0);
    // glTF 로컬: 앞으로 숙임 = X 음수 (모델이 -Z를 봄)
    this.torso.rotation.x = -p.torsoX; this.torso.scale.set(1 - br * amp * 0.5, 1 + br * amp, 1 - br * amp * 0.5);
    this.neck.rotation.x = -(p.headX + br * 0.01); this.neck.rotation.y = walking ? Math.sin(t * Math.PI * 2 * 0.8) * 0.08 : 0;
    this.wings.forEach((w, i) => { const s = i === 0 ? -1 : 1;
      w.rotation.x = -(p.wing[0] + swing * -s * 0.35);   // 앞으로 = X 양수 (Blender +X)
      w.rotation.z = -s * p.wing[1]; });                   // 안쪽으로 (Blender Y → glTF -Z)
    this.legs.forEach((l, i) => { const s = i === 0 ? -1 : 1;
      l.rotation.x = -(p.leg[0] + swing * s * 0.55); l.rotation.z = s * p.leg[1]; });
    this.eyes.forEach(e => { e.scale.y = this.base.eyeY * p.eye; });
  };

    const src = this.ctx.createBufferSource(); src.buffer = buf; src.loop = true;

  },
  setOn(v) {

/* ───────────── 배경 소리: 자연(시간대 × 계절) + 연못 물소리 + 고요당 염불(거리) ───────────── */
const AMB_FILES = {
  birds: 'audio/nature-birds.mp3', cicada: 'audio/nature-cicada.mp3', sumNight: 'audio/nature-summer-night.mp3',
  autNight: 'audio/nature-autumn-night.mp3', wind: 'audio/nature-winter-wind.mp3', stream: 'audio/nature-stream.mp3',
  chant: REC[VOL.chantTrack].file,

// [새, 매미, 여름밤, 가을밤, 겨울바람]
const AMB_MIX = {
  spring: { dawn: [0.9, 0, 0, 0, 0], day: [1, 0, 0, 0, 0], dusk: [0.5, 0, 0.35, 0, 0], night: [0, 0, 0.7, 0, 0] },
  summer: { dawn: [0.6, 0.3, 0, 0, 0], day: [0.3, 0.85, 0, 0, 0], dusk: [0.2, 0.4, 0.5, 0, 0], night: [0, 0, 1, 0, 0] },
  autumn: { dawn: [0.7, 0, 0, 0, 0.15], day: [0.7, 0, 0, 0, 0.2], dusk: [0.3, 0, 0, 0.6, 0.15], night: [0, 0, 0, 1, 0.1] },
  winter: { dawn: [0.15, 0, 0, 0, 0.7], day: [0.2, 0, 0, 0, 0.8], dusk: [0, 0, 0, 0, 0.75], night: [0, 0, 0, 0, 0.6] },
};
const Amb = {
  ready: false, tracks: {}, lastT: 0,
  // 아이폰·사파리는 소리 파일을 조각(Range)으로 받으려 해서, 서버가 조각을 안 주면 반복 재생이 끊길 수 있다.
  // → 애플 계열은 파일을 통째로 받아 blob 주소로 바꿔 끼움(압축 그대로라 메모리 부담 작음). 다른 곳은 오류 날 때만.
  // WebKit(아이폰·아이패드 모든 브라우저와 앱 안 브라우저, 맥 사파리) — 크롬·안드로이드 계열 제외
  appleWebKit: /AppleWebKit/i.test(navigator.userAgent) && !/Chrome|Chromium|Android/i.test(navigator.userAgent),
  SILENT: 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==',
  viaBlob(el, f) {
    if (el.dataset.src !== f) return;                 // 이미 다른 곡으로 바뀜 — 받지 않음
    fetch(f).then(r => (r.ok ? r.blob() : Promise.reject())).then(b => {
      if (el.dataset.src !== f) return;               // 그사이 곡이 바뀜
      if (el.dataset.blob) URL.revokeObjectURL(el.dataset.blob);
      const u = URL.createObjectURL(b); el.dataset.blob = u; el.src = u; el.play().catch(() => {});
      if (this.tracks.chant && el === this.tracks.chant.el) BG.follow(u);   // 백그라운드용 염불도 같은 파일로
    }).catch(() => {});
  },
  load(el, f) {
    el.dataset.src = f;

      // 애플: 짧은 무음으로 지금(누른 순간) 재생을 열어 두고, 파일은 한 번만 통째로 받아 바꿔 끼움
      if (!el.dataset.blob) { el.src = this.SILENT; el.play().catch(() => {}); }

    }
    el.src = f; el.play().catch(() => {});
    if (el._onErr) el.removeEventListener('error', el._onErr);

  },
  start() {                                         // 입장 버튼(사용자 동작) 안에서 한 번
    Snd.init(); Snd.loadShots(); if (!Snd.ctx || this.ready) return;
    const ctx = Snd.ctx;
    this.natBus = ctx.createGain(); this.natBus.gain.value = VOL.nature; this.natBus.connect(Snd.master);

      catch (e) { el.volume = 0; }                 // Web Audio로 못 묶으면 요소 볼륨으로

  },
  setChant(k) {                                     // 소리 패널에서 염불 곡 바꾸기
    VOL.chantTrack = k; saveVol();

    const dh = Math.hypot(S.pos.x, S.pos.z - HALL.front);

/* ───────────── 백그라운드 재생 (2026-10-31 사용자 '산사처럼') ─────────────
   켜 둠(기본): 다른 탭을 보거나 화면을 꺼도 소리가 이어짐. 크롬·안드로이드·맥은 원래 이어지니 그대로 두고,

   꺼 둠: 숨는 순간 모든 소리를 멈추고, 돌아오면 다시. */
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const BG = {
  el: null, out: false,
  prime() {                                         // 입장 버튼(사용자 동작) 안에서 한 번

    const el = new Audio(); el.loop = true; el.muted = true; el.preload = 'auto';
    const t = Amb.tracks.chant;
    el.src = (t && t.el.dataset.blob) || Amb.SILENT; el.play().catch(() => {});
    this.el = el;

        navigator.mediaSession.setActionHandler('play', () => { el.play().catch(() => {}); });

  hide() {

    }

// 기와 지붕 단면 (처마 끝이 들린 곡선) → 앞뒤로 밀어낸 형태
function roofGeo(w, h, depth) {

function holdButton(btn, ms, fn) {
  const fill = btn.querySelector('.fill'); let t0 = 0, raf = 0;
  const step = () => {
    const k = Math.min(1, (performance.now() - t0) / ms); fill.style.transform = `scaleX(${k})`;

  const cancel = () => { cancelAnimationFrame(raf); raf = 0; fill.style.transform = 'scaleX(0)'; };
  btn.addEventListener('pointerdown', e => { e.preventDefault(); t0 = performance.now(); raf = requestAnimationFrame(step); });
  btn.addEventListener('pointerup', () => { if (raf) { cancel(); toast(T().hapHold, 2000); } }); // 짧게 누르면 '길게 누르세요'
  ['pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, () => { if (raf) cancel(); }));

// meshopt 로 줄인 위치값(정수)은 r128 이 getX 에서 풀지 않아 직접 푼다(정규화된 경우).
function bakeParts(d) {
  const nodes = [d.root].concat(ANIM.map(n => d.root.getObjectByName(n)));
  d.root.updateMatrixWorld(true);
  const inv = nodes.map(n => new THREE.Matrix4().copy(n.matrixWorld).invert()), groups = new Map();
  d.root.traverseVisible(o => {
    if (!o.isMesh || !o.geometry.attributes.position) return;
    let b = o, bi = -1;
    while (b && (bi = nodes.indexOf(b)) < 0) b = b.parent;
    if (bi < 0) bi = 0;
    const key = bi + '|' + o.material.uuid;
    if (!groups.has(key)) groups.set(key, { bone: bi, material: o.material, parts: [] });
    groups.get(key).parts.push({ geo: o.geometry, m: new THREE.Matrix4().multiplyMatrices(inv[bi], o.matrixWorld) });
  });
  const unq = a => { if (!a.normalized) return 1; const arr = a.isInterleavedBufferAttribute ? a.data.array : a.array;
    return arr instanceof Int8Array ? 1 / 127 : arr instanceof Uint8Array ? 1 / 255 : arr instanceof Int16Array ? 1 / 32767 : arr instanceof Uint16Array ? 1 / 65535 : 1; };
  return [...groups.values()].map(g => {
    let nv = 0, ni = 0;
    g.parts.forEach(({ geo }) => { nv += geo.attributes.position.count; ni += geo.index ? geo.index.count : geo.attributes.position.count; });
    const pos = new Float32Array(nv * 3), idx = new Uint32Array(ni), v = new THREE.Vector3();
    let ov = 0, oi = 0;
    g.parts.forEach(({ geo, m }) => {
      const a = geo.attributes.position, k = unq(a);
      for (let i = 0; i < a.count; i++) { v.set(a.getX(i) * k, a.getY(i) * k, a.getZ(i) * k).applyMatrix4(m); pos[(ov + i) * 3] = v.x; pos[(ov + i) * 3 + 1] = v.y; pos[(ov + i) * 3 + 2] = v.z; }
      const ix = geo.index;
      if (ix) for (let i = 0; i < ix.count; i++) idx[oi++] = ix.getX(i) + ov; else for (let i = 0; i < a.count; i++) idx[oi++] = i + ov;
      ov += a.count;
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals(); geo.computeBoundingSphere();
    return { bone: g.bone, material: g.material, geometry: geo };
  });
}

const Crowd = {
  ready: false, loading: false, lods: null, puppet: null, bones: null,
  R: new THREE.Matrix4(), M: new THREE.Matrix4(), q: new THREE.Quaternion(), up: new THREE.Vector3(0, 1, 0), one: new THREE.Vector3(1, 1, 1), p: new THREE.Vector3(),
  frus: new THREE.Frustum(), pv: new THREE.Matrix4(), sph: new THREE.Sphere(new THREE.Vector3(), 1.3),
  load() {
    if (this.loading || !window.MaumDuckGLB) return; this.loading = true;
    const near = new MaumDuckGLB(DUCK_LITE, () => {
      const far = new MaumDuckGLB(DUCK_FAR, () => this.build(near, far), () => this.build(near, null));
    }, () => {});
  },
  build(near, far) {
    const make = (d, shadow) => bakeParts(d).map(g => {
      const im = new THREE.InstancedMesh(g.geometry, g.material, ROOM_MAX);
      im.count = 0; im.frustumCulled = false; im.castShadow = shadow; im.receiveShadow = shadow;
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(im);
      return { bone: g.bone, mesh: im };
    });
    const lod0 = make(near, true);
    this.lods = [lod0, far ? make(far, false) : lod0];
    // 동작 계산용 꼭두각시 = 굽고 난 가까운 오리 (장면엔 안 넣음). 사람마다 자세 상태만 따로 두고 뼈를 빌려 쓴다.
    this.puppet = near; near.root.updateMatrixWorld(true);
    this.bones = [near.root].concat(ANIM.map(n => near.root.getObjectByName(n)));
    this.ready = true;
  },
  // 사람 한 명의 자세 상태 (꼭두각시의 함수·뼈는 물려받고 시간·자세만 자기 것)
  state() { const st = Object.create(this.puppet); st.cur = {}; st.setPose('stand', true); return st; },
  // 이 사람 자세를 dt 만큼 진행해 꼭두각시 뼈에 씌우고, 뼈 행렬을 복사해 둔다
  pose(o, dt) {
    o.st.update(dt);
    for (let i = 1; i < this.bones.length; i++) { const b = this.bones[i]; b.updateMatrix(); b.matrixWorld.multiplyMatrices(b.parent.matrixWorld, b.matrix); }
    for (let i = 0; i < this.bones.length; i++) o.bm[i].copy(this.bones[i].matrixWorld);
  },
  begin() {
    this.lods.forEach(l => l.forEach(g => { g.mesh.count = 0; }));
    this.pv.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); this.frus.setFromProjectionMatrix(this.pv);
  },
  put(o, y) {
    this.q.setFromAxisAngle(this.up, o.face + Math.PI); this.p.set(o.x, y, o.z);
    this.R.compose(this.p, this.q, this.one);
    const lod = this.lods[o.lod];
    for (let i = 0; i < lod.length; i++) { const g = lod[i]; this.M.multiplyMatrices(this.R, o.bm[g.bone]); g.mesh.setMatrixAt(g.mesh.count++, this.M); }
  },
  end() { this.lods.forEach(l => l.forEach(g => { g.mesh.instanceMatrix.needsUpdate = true; })); },
  visible(x, y, z) { this.sph.center.set(x, y + 0.8, z); return this.frus.intersectsSphere(this.sph); },
};

const Room = {
  room: null, roomName: null, others: new Map(), lastSent: 0, lastKey: '', rank: 0, lights: null, near: 12,
  // 나의 익명 이름: 처음 오면 108개 중 무작위로 정해 기기에 기억. 우리 서버는 그 방에서 겹치면 빈 이름을 대신 줌(myName)
  myPref: (() => {
    let n = -1; try { n = parseInt(localStorage.getItem('maumon.name'), 10); } catch (e) { /* 저장 공간 막힘 */ }
    if (!(n >= 0 && n < NAMES.length)) { n = Math.floor(Math.random() * NAMES.length); try { localStorage.setItem('maumon.name', String(n)); } catch (e) { /* 그대로 */ } }
    return n;
  })(),
  myName() { return this.room && this.room.myName >= 0 ? this.room.myName : this.myPref; },
  on: false,
  init(room) {
    this.room = room;
    Crowd.load();
    room.onPeers(ch => {
      if (room.roomName) this.roomName = room.roomName;
      ch.left.forEach(p => this.drop(p.peer));
      ch.peers.forEach(p => { if (!(p.isMe && p.sameTab) && p.kind === 'viewer') this.upsert(p, !!ch.snap); });
      renderTogether();
    }, () => { [...this.others.keys()].forEach(k => this.drop(k)); renderTogether(); });
  },
  upsert(p, snap) {
    const pr = p.presence || {};
    const num = (v, lo, hi) => (typeof v === 'number' && isFinite(v) ? Math.max(lo, Math.min(hi, v)) : null);
    const x = num(pr.x, -40, 40), z = num(pr.z, -60, 45);
    if (x === null || z === null) { if (this.others.delete(p.peer)) renderTogether(); return; } // 위치를 비운 사람(나감)·아직 안 보낸 사람
    let o = this.others.get(p.peer);
    if (!o) {
      if (this.others.size >= ROOM_MAX) return;
      o = { x, z, face: num(pr.f, -100, 100) || 0, bob: Math.random() * 6, pose: 'stand', lod: 1, acc: 1, st: null, bm: null, dist: 99 };
      this.others.set(p.peer, o);
      this.rank = 0;                                          // 새 사람이 오면 바로 다시 고른다
    }
    o.tx = x; o.tz = z; o.tf = num(pr.f, -100, 100) || 0; o.seen = performance.now();
    const pose = POSES_OK.includes(pr.p) ? pr.p : 'stand';
    if (pose === 'hapjang' && o.pose !== 'hapjang' && o.known) News.hap(o);   // 합장을 시작한 순간에만 (처음 보이는 사람은 빼고)
    const c = Number.isInteger(pr.c) && pr.c >= 0 ? pr.c : 0;     // 이번 방문에서 108배를 마친 횟수
    if (o.known && c > (o.c || 0)) News.bow(o);
    o.c = c; o.pose = pose; o.known = true;
    o.nm = Number.isInteger(pr.nm) && pr.nm >= 0 && pr.nm < NAMES.length ? pr.nm : -1;   // 익명 이름 번호
    const mode = MODES_OK.includes(pr.m) ? pr.m : 'walk';
    // 연못에 앉은 때(내 화면 기준): 들어올 때 받은 명단에 이미 앉아 있던 사람은 0 = '나보다 먼저'.
    // 중간에 새로 보인 사람(다시 접속해 내 자리에 앉은 사람)은 지금 앉은 것으로 — 그쪽이 옮김 (플랫폼 room 은 명단 구분이 없어 예전처럼)
    if (mode === 'pond' && (o.mode !== 'pond' || Math.hypot(x - o.px, z - o.pz) > 0.5)) { o.pondAt = o.mode === undefined && (snap || !this.room.ws) ? 0 : performance.now(); o.px = x; o.pz = z; }
    o.mode = mode;
  },
  drop(peer) { this.others.delete(peer); },
  // 들어올 때 켜고 나갈 때 끔. 우리 서버는 연결 자체를 열고 닫고, 플랫폼 room 은 내 위치를 비움.
  start() { this.on = true; this.lastKey = ''; this.lastSent = 0; if (this.room && this.room.start) this.room.start(); },
  stop() {
    this.on = false;
    // 플랫폼 room 은 presence 를 필드별로 합치므로 null 로 지워야 다른 사람 화면에서 사라짐
    if (this.room) { if (this.room.stop) this.room.stop(); else this.room.presence({ x: null, z: null, f: null, p: null, m: null }).catch(() => {}); }
    this.others.clear(); renderTogether();
  },
  // 등불: 오리 모델을 받기 전(또는 못 받으면) 사람마다 따뜻한 빛 한 점
  makeLights() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,240,200,1)'); gr.addColorStop(0.25, 'rgba(255,196,110,0.85)'); gr.addColorStop(1, 'rgba(255,170,80,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((ROOM_MAX + 1) * 3), 3));
    geo.setDrawRange(0, 0);
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.9, map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffd08a }));
    pts.frustumCulled = false; scene.add(pts); this.lights = pts;
  },
  update(dt) {
    if (!this.room) return;
    if (!this.on) {                                   // 입장 전·나간 뒤: 아무도 안 그리고 안 보냄
      if (Crowd.ready) { Crowd.begin(); Crowd.end(); }
      if (this.lights) this.lights.geometry.setDrawRange(0, 0);
      return;
    }
    // 내 상태 보내기 (바뀌었을 때만, 초당 5번까지 · 가만히 있어도 20초마다 '여기 있어요')
    const r2 = v => Math.round(v * 100) / 100;
    const me = { x: r2(S.pos.x), z: r2(S.pos.z), f: r2(Math.atan2(Math.sin(D.face), Math.cos(D.face))), p: D.override || duck.pose, m: S.mode, nm: this.myName(), c: S.done108 }; // 방향은 ±π 로 접어서 · nm 은 플랫폼 room 용(우리 서버는 자기가 준 이름을 씀)
    const key = JSON.stringify(me), now = performance.now();
    if ((key !== this.lastKey && now - this.lastSent > 200) || now - this.lastSent > 20000) { this.lastKey = key; this.lastSent = now; this.room.presence(me).catch(() => {}); }
    // 75초 넘게 소식 없는 사람은 정리 (연결이 조용히 끊긴 경우)
    let gone = false;
    if (this.room.ws) this.others.forEach((o, id) => { if (now - o.seen > 75000) { this.drop(id); gone = true; } });
    if (gone) renderTogether();
    // 0.25초마다: 가까운 12명(15m 안)은 원래 모양, 나머지는 가벼운 모양
    if ((this.rank -= dt) <= 0) {
      this.rank = 0.25;
      const list = [...this.others.values()];
      list.forEach(o => { o.dist = Math.hypot(o.x - S.pos.x, o.z - S.pos.z) - (o.lod === 0 ? 0.8 : 0); }); // 0.8m 덤: 경계에서 깜빡이지 않게
      list.sort((a, b) => a.dist - b.dist).forEach((o, i) => { o.lod = i < this.near && o.dist < 15 ? 0 : 1; });
    }
    const k = Math.min(1, dt * 8), cam = camera.position;
    let n = 0;
    if (Crowd.ready) Crowd.begin();
    this.others.forEach(o => {
      const moving = Math.hypot(o.tx - o.x, o.tz - o.z) > 0.02;
      o.x += (o.tx - o.x) * k; o.z += (o.tz - o.z) * k;
      let df = o.tf - o.face; df = Math.atan2(Math.sin(df), Math.cos(df)); o.face += df * k;
      const gy = groundY(o.x, o.z) + (o.mode === 'hall' ? 0.17 : o.mode === 'pond' ? pondLift(o) : 0);
      o.acc += dt;
      if (Crowd.ready) {
        if (!o.st) { o.st = Crowd.state(); o.bm = Crowd.bones.map(() => new THREE.Matrix4()); }
        const want = o.pose === 'walk' && !moving ? 'stand' : o.pose;
        if (o.st.pose !== want) { o.st.setPose(want); o.acc = Math.max(o.acc, 1); }      // 동작이 바뀌면 바로 한 번 계산
        if (Math.hypot(o.x - cam.x, o.z - cam.z) < 1.0) return;                    // 카메라에 너무 붙은 오리는 잠깐 숨김
        if (!Crowd.visible(o.x, gy, o.z)) return;                                   // 화면 밖: 그리지도, 움직이지도 않음(시간은 모아 둠)
        const every = o.lod === 0 ? 0 : o.dist < 18 ? 1 / 15 : 1 / 6;
        if (o.acc >= every) { Crowd.pose(o, o.st.pose === 'bow' ? o.acc * 4 / BOW_SEC : o.acc); o.acc = 0; }
        Crowd.put(o, gy);
      } else {
        if (!this.lights) this.makeLights();
        o.bob += dt;
        this.lights.geometry.attributes.position.setXYZ(n++, o.x, gy + 1.1 + Math.sin(o.bob * 1.3) * 0.08, o.z);
      }
    });
    if (Crowd.ready) Crowd.end();
    if (this.lights) { this.lights.visible = !Crowd.ready; this.lights.geometry.setDrawRange(0, n); this.lights.geometry.attributes.position.needsUpdate = n > 0; }
  },
};

/* 정식 배포용: 우리 서버 웹소켓을 플랫폼 room 과 같은 모양(presence·onPeers)으로 감싼다.
   서버 → {t:'hi', id, room, u} 처음 한 번, {t:'s', u:{id:[x,z,f,포즈번호,장소번호]}, l:[나간 id]} 0.2초마다.
   방이 꽉 차면 {t:'full'} → 다른 방을 다시 묻는다. 끊기면 1·2·4…30초 뒤 같은 방으로 다시 붙는다.
   입장할 때 start(), 나갈 때 stop(). 화면을 숨긴 사이 서버가 '조용함'으로 끊으면(70초) 다시 보일 때까지 기다렸다 붙는다
   — 숨은 탭이 1분마다 나갔다 들어오며 방 자리를 차지하지 않게. */
function wsRoom(path, first, getName) {
  let ws = null, peersCb = null, lostCb = null, myId = null, wait = 1000, last = null, on = false, waiting = false;
  const peer = (id, s) => ({ peer: id, kind: 'viewer', presence: { x: s[0], z: s[1], f: s[2], p: POSES_OK[s[3]], m: MODES_OK[s[4]], nm: s.length > 5 ? s[5] : -1, c: s.length > 6 ? s[6] : 0 } });
  const api = {
    ws: true, roomName: null, myName: -1,
    presence(me) { last = me; if (ws && ws.readyState === 1) ws.send(JSON.stringify(Object.assign({ t: 'p' }, me))); return Promise.resolve(); },
    onPeers(fn, lost) { peersCb = fn; lostCb = lost; },
    start() { if (on) return; on = true; wait = 1000; open(api.roomName || first, null, true); }, // true: 오늘 들어온 사람으로 셈
    stop() {
      on = false; last = null; const w = ws; ws = null;
      if (w) { w.onclose = null; try { w.close(1000, 'leave'); } catch (_) {} }
    },
  };
  function whenVisible() {
    if (waiting) return; waiting = true;
    addEventListener('visibilitychange', function v() {
      if (document.hidden) return;
      removeEventListener('visibilitychange', v); waiting = false;
      if (on && !ws) open(api.roomName);
    });
  }
  function open(room, full, isNew) {
    if (!on) return;
    const u = new URL(path, location.href); u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    if (room) u.searchParams.set('room', room);
    if (full) u.searchParams.set('full', full);
    if (isNew) u.searchParams.set('new', '1');
    const nm = api.myName >= 0 ? api.myName : getName ? getName() : -1;   // 다시 붙을 때도 같은 이름을 먼저 청함
    if (nm >= 0) u.searchParams.set('nm', String(nm));
    let me; try { me = ws = new WebSocket(u); } catch (e) { return; }
    me.onmessage = e => {
      let d; try { d = JSON.parse(e.data); } catch (_) { return; }
      if (d.t === 'full') { me.onclose = null; me.close(); open(null, d.room); return; }
      if (d.t === 'hi') {
        myId = d.id; api.roomName = d.room; wait = 1000; api.myName = Number.isInteger(d.nm) ? d.nm : -1;
        if (peersCb) peersCb({ peers: Object.entries(d.u || {}).map(([k, s]) => peer(k, s)), left: [], snap: true });
        if (last) api.presence(last);
        return;
      }
      if (d.t === 's' && peersCb) peersCb({ peers: Object.entries(d.u || {}).filter(([k]) => k !== myId).map(([k, s]) => peer(k, s)), left: (d.l || []).map(k => ({ peer: k })) });
    };
    me.onclose = () => {
      if (ws !== me) return;
      ws = null;
      if (lostCb) lostCb();
      if (!on) return;
      if (document.hidden) { whenVisible(); return; }  // 숨은 동안은 다시 붙지 않음
      setTimeout(() => { if (!on || ws) return; if (document.hidden) whenVisible(); else open(api.roomName); }, wait);
      wait = Math.min(wait * 2, 30000);
    };
  }
  return api;
}

const WS_PATH = (document.querySelector('meta[name="maumon:ws"]') || {}).content;
if (WS_PATH) {
  const invited = new URLSearchParams(location.search).get('room');
  Room.init(wsRoom(WS_PATH, /^r[1-9][0-9]{0,4}$/.test(invited || '') ? invited : null, () => Room.myPref));
} else if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('room').then(room => { if (room) Room.init(room); }).catch(() => {});
}

applyTod();
requestAnimationFrame(frame);

// 테스트·디버그용
window.__maumon = { renderer, Crowd, Quality, BG, Snd, PONDCAM, TREES, get entered() { return entered; }, hapjang, bowDone, News, buddha3d, JOY, BOWCAM, toggleAutoBow, CUSHIONS, Amb, VOL, Room, duck, D, CAM, setSeason: v => { season = v; applyTod(); }, S, rec, med, doBow, startMed, sitHall, sitLeafNow, POND_SEATS, pickPondSeat, ring, standUp, goTo, startGuide, setLang: l => { lang = l; renderUI(); }, get lang() { return lang; }, get tod() { return tod; } };
})();
</script>
